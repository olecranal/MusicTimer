<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Music Timer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <div class="now-playing">
        <span class="now-playing__title" id="statusTitle">…</span>
        <span class="now-playing__context" id="statusContext"></span>
      </div>
      <button
        id="settingsToggle"
        class="icon-button"
        type="button"
        aria-expanded="false"
        aria-controls="settingsPanel"
        aria-label="Settings"
        title="Settings"
      >⚙</button>
    </header>

    <div class="timer-label" id="timerLabel">Timer</div>
    <div class="clock" id="clock">0:00:00</div>
    <div class="current-lap" id="currentLap"></div>

    <div class="row row--buttons">
      <button id="lap" class="icon-action" type="button" aria-label="Record lap" title="Record lap">
        <svg viewBox="0 0 24 24"><path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6h-5.6z"></path></svg>
      </button>
      <button id="toggle" class="icon-action" type="button" aria-label="Start timer" title="Start timer">
        <svg id="toggleIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
      </button>
      <button id="reset" class="icon-action" type="button" aria-label="Reset timer" title="Reset timer">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"></path></svg>
      </button>
    </div>

    <section>
      <div class="section-header">
        <button class="section-toggle" id="timersToggle" type="button" aria-expanded="true" aria-controls="timersBody">
          <svg class="section-toggle__chevron" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"></path></svg>
          <span class="section-toggle__title">Timers</span>
          <span class="section-toggle__count" id="timersCount">0</span>
        </button>
        <div class="section-header__actions" id="timersActions">
          <button id="addTimer" class="section-action section-action--new" type="button" aria-label="New timer" title="New timer">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"></path></svg>
          </button>
          <button id="deleteTimer" class="section-action section-action--delete" type="button" aria-label="Delete timer" title="Delete timer">
            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"></path></svg>
          </button>
        </div>
        <span class="section-toggle__summary" id="timersSummary"></span>
      </div>
      <div id="timersBody">
        <div class="timer-list" id="timers"></div>
      </div>
    </section>

    <section id="lapSection" hidden>
      <div class="section-header">
        <button class="section-toggle" id="lapsToggle" type="button" aria-expanded="true" aria-controls="lapsBody">
          <svg class="section-toggle__chevron" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"></path></svg>
          <span class="section-toggle__title">Laps</span>
          <span class="section-toggle__count" id="lapsCount">0</span>
        </button>
        <span class="section-toggle__summary" id="lapsSummary"></span>
      </div>
      <div id="lapsBody">
        <div class="lap-list" id="laps"></div>
        <p class="hint">Click a lap to rename it.</p>
      </div>
    </section>

    <div id="settingsPanel" hidden>
      <section>
        <h2>When the timer stops</h2>
        <div class="mode-switch" id="mode">
          <button data-mode="auto" class="on">Follow the music</button>
          <button data-mode="sticky">Only when I say</button>
        </div>
        <p class="hint" id="modeHint">Runs while music plays, pauses the moment it stops.</p>
      </section>

      <section>
        <h2>Count only one playlist</h2>
        <div class="filter" id="filter">
          <div class="filter__name" id="filterName">Any music counts</div>
          <div class="filter__source" id="filterSub"></div>
        </div>
        <div class="row">
          <button id="useCurrent">Use current</button>
          <button id="clearFilter" class="ghost">Any music</button>
        </div>
        <p class="hint">A timer bound to a playlist takes over automatically when that playlist plays.</p>
      </section>
    </div>

    <footer id="tabs"></footer>

    <script src="shared/logger.js"></script>
    <script src="shared/contract.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
